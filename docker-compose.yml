services:
  vevey-db:
    build:
      dockerfile: docker/postgres.Dockerfile
      context: .
    image: postgres.local:18
    container_name: vevey-db
    restart: no
    hostname: dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_vevey
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - vevey-db:/var/lib/postgresql
    networks:
      - dev-vevey
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --quiet --username=postgres --dbname=postgres || exit 1']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 15s

  vevey-redis:
    build:
      dockerfile: docker/redis.Dockerfile
      context: .
    image: redis.local:8
    container_name: vevey-redis
    restart: no
    hostname: dev
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    networks:
      - dev-vevey
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --raw incr ping || exit 1']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 15s

  vevey-mailpit:
    build:
      dockerfile: docker/mailpit.Dockerfile
      context: .
    image: mailpit.local:1
    container_name: vevey-mailpit
    restart: no
    hostname: dev
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - dev-vevey
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 10s

  vevey-rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: vevey-rustfs
    restart: no
    hostname: dev
    environment:
      RUSTFS_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:-rustfsadmin}'
      RUSTFS_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:-rustfsadmin}'
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_OBS_LOGGER_LEVEL: error
      TZ: America/Sao_Paulo
    ports:
      - '${FORWARD_RUSTFS_PORT:-9000}:9000'
      - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
    volumes:
      - vevey-rustfs:/data
    networks:
      - dev-vevey
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:9000/health || exit 1']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 10s

  vevey-rustfs-bucket:
    image: amazon/aws-cli:2.33.11
    restart: no
    depends_on:
      vevey-rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-rustfsadmin}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-rustfsadmin}'
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: '${AWS_BUCKET:-vevey}'
    entrypoint:
      - sh
      - -c
      - |
        aws --endpoint-url http://vevey-rustfs:9000 s3 mb "s3://$$BUCKET" 2>/dev/null || true &&
        aws --endpoint-url http://vevey-rustfs:9000 s3api put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}"
    networks:
      - dev-vevey

volumes:
  vevey-db:
    name: vevey-db
  vevey-rustfs:
    name: vevey-rustfs

networks:
  dev-vevey:
    name: dev-vevey
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dev-vevey
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
